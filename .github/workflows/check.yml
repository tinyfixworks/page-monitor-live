name: Yettel Homepage Link Monitor

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: homepage-link-monitor
  cancel-in-progress: false

jobs:
  check-homepage-links:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Check homepage links
        run: python checker.py

      - name: Commit latest report for dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results.json
          if ! git diff --cached --quiet; then
            git commit -m "Update homepage link report"
            git push
          else
            echo "Report has no changes."
          fi

      - name: Upload link report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yettel-homepage-link-report
          path: results.json
          if-no-files-found: warn
          retention-days: 30
