<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URL Monitor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="dashboard">
    <header class="header">
      <div>
        <h1>URL Monitor</h1>
        <p>Website health at a glance</p>
      </div>
      <div class="last-check">
        <span>Last check</span>
        <strong id="last-check">Loading...</strong>
      </div>
    </header>

    <section class="summary">
      <div class="stat"><strong id="healthy-count">—</strong><span>Healthy</span></div>
      <div class="stat attention"><strong id="attention-count">—</strong><span>Needs attention</span></div>
      <div class="stat"><strong id="total-count">—</strong><span>Total URLs</span></div>
      <button class="check-button" id="check-button" type="button">Check now</button>
    </section>

    <section class="section attention-section">
      <div class="section-heading">
        <div><h2>Needs attention</h2><p>These URLs require a closer look.</p></div>
        <span class="count-badge" id="attention-badge">0</span>
      </div>
      <div class="problem-list" id="problem-list"></div>
    </section>

    <section class="section">
      <div class="section-heading">
        <div><h2>All monitored URLs</h2><p>Current status of every monitored page.</p></div>
        <div class="filters">
          <button class="filter active" data-filter="all">All</button>
          <button class="filter" data-filter="problem">Attention</button>
          <button class="filter" data-filter="healthy">Healthy</button>
        </div>
      </div>
      <div class="url-list" id="url-list"></div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
